<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ka-Panda - Log Out</title>
  <style>
    /* General reset and styling */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('https://gifdb.com/images/high/panda-waving-cartoon-sticker-pi4qfklzce0s7zo5.gif') no-repeat center center/cover;
      overflow: hidden;
    }

    .logout-container {
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      max-width: 400px;
    }

    .logout-container h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #f39c12;
    }

    .logout-container p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .logout-container button {
      font-size: 1rem;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: rgba(243, 156, 18, 0.9);
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .logout-container button:hover {
      background: rgba(243, 156, 18, 1);
    }
  </style>
</head>
<body>
  <div class="logout-container">
    <h1>Logging Out...</h1>
    <p>You are being redirected to the login page.</p>
    <button id="logoutButton">Log Out Now</button>
  </div>

  <script>
    // Simulate a logout action
    function logOut() {
      // Clear any user data (if stored)
      localStorage.clear();
      sessionStorage.clear();

      // Redirect to the login page
      window.location.href = "log-in.html";
    }

    // Automatically log out after a delay
    setTimeout(logOut, 3000); // Redirect after 3 seconds

    // Allow manual logout via button click
    document.getElementById('logoutButton').addEventListener('click', logOut);
  </script>
</body>
</html>
