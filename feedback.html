<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ka-Panda - Feedback</title>
  <style>
    /* General reset and styling */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Background GIF styling */
    body {
      background: url('https://gifdb.com/images/high/panda-waving-cartoon-sticker-pi4qfklzce0s7zo5.gif') no-repeat center center/cover;
      overflow: hidden;
    }

    /* Navbar styling */
    .navbar {
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      margin: 0;
      font-size: 2rem;
      color: #f39c12;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-buttons a {
      text-decoration: none;
      color: white;
      font-size: 1rem;
      padding: 10px 15px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.3s ease;
    }

    .nav-buttons a:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Feedback Form Styling */
    .feedback-container {
      max-width: 800px;
      margin: 50px auto;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .feedback-container h2 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    .feedback-container form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .feedback-container label {
      font-size: 1.2rem;
      text-align: left;
    }

    .feedback-container textarea,
    .feedback-container button {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .feedback-container textarea {
      resize: vertical;
      height: 100px;
    }

    .feedback-container button {
      background: rgba(243, 156, 18, 0.9);
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .feedback-container button:hover {
      background: rgba(243, 156, 18, 1);
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }

    .star {
      font-size: 2rem;
      cursor: pointer;
      color: gray;
      transition: color 0.2s ease;
    }

    .star.selected {
      color: gold;
    }

    .graph-container {
      margin-top: 30px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .graph-container canvas {
      width: 100%;
      max-width: 700px;
      height: 300px;
    }

    /* Back button styling */
    .back-button {
      position: fixed;
      top: 150px;
      left: 370px;
      background: rgba(0, 0, 0, 0.492);
      color: white;
      padding: 10px 15px;
      font-size: 1rem;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.3s ease;
      cursor: pointer;
    }

    .back-button:hover {
      background: rgb(255, 153, 0);
    }
  </style>
</head>
<body>
  <!-- Back Button -->
  <a href="home.html" class="back-button">
    <i class="fas fa-arrow-left"></i> Back
  </a>

  <!-- Navigation Bar -->
  <div class="navbar">
    <h1>Ka-Panda</h1>
    <div class="nav-buttons">
        <a href="home.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="life_advice.html">Life Advice</a>
        <a href="love_advice.html">Love Advice</a>
        <a href="maturity_tips.html">Maturity Tips</a>
        <a href="notifications.html">Notifications</a>
        <a href="report-a-problem.html">Report a Problem</a>
        <a href="feedback.html">Feedback</a>
        <a href="log-out.html">Log Out</a>
    </div>
  </div>

  <!-- Feedback Section -->
  <div class="feedback-container">
    <h2>We Value Your Feedback!</h2>
    <form id="feedbackForm">
      <label>Your Feedback:</label>
      <textarea id="feedbackMessage" placeholder="Write your feedback here..." required></textarea>

      <label>Rate Us:</label>
      <div class="stars" id="starContainer">
        <span class="star" data-value="1">&#9733;</span>
        <span class="star" data-value="2">&#9733;</span>
        <span class="star" data-value="3">&#9733;</span>
        <span class="star" data-value="4">&#9733;</span>
        <span class="star" data-value="5">&#9733;</span>
      </div>

      <button type="submit">Submit Feedback</button>
    </form>

    <div id="responseMessage"></div>
  </div>

  <!-- Graph Section -->
  <div class="graph-container">
    <h2>Feedback Ratings Overview</h2>
    <canvas id="ratingGraph"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const feedbackForm = document.getElementById('feedbackForm');
    const responseMessage = document.getElementById('responseMessage');
    const stars = document.querySelectorAll('.star');
    const ratingGraph = document.getElementById('ratingGraph');

    let selectedRating = 0;
    const ratingsData = [0, 0, 0, 0, 0]; // Array to track star ratings

    // Highlight stars based on selection
    stars.forEach(star => {
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.getAttribute('data-value'));
        stars.forEach(s => s.classList.remove('selected'));
        for (let i = 0; i < selectedRating; i++) {
          stars[i].classList.add('selected');
        }
      });
    });

    // Form submission
    feedbackForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (selectedRating === 0) {
        responseMessage.innerHTML = '<p style="color: red;">Please select a star rating!</p>';
        return;
      }

      const feedbackMessage = document.getElementById('feedbackMessage').value;
      responseMessage.innerHTML = '<p style="color: lightgreen;">Thank you for your feedback!</p>';

      // Update ratings data
      ratingsData[selectedRating - 1]++;
      updateGraph();

      feedbackForm.reset();
      stars.forEach(star => star.classList.remove('selected'));
      selectedRating = 0;
    });

    // Initialize Chart.js pie chart
    const chart = new Chart(ratingGraph, {
      type: 'pie',
      data: {
        labels: ['1 Star', '2 Stars', '3 Stars', '4 Stars', '5 Stars'],
        datasets: [{
          label: 'Feedback Ratings',
          data: ratingsData,
          backgroundColor: ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#3498db'],
        }]
      },
      options: {
        responsive: true,
      }
    });

    function updateGraph() {
      chart.data.datasets[0].data = ratingsData;
      chart.update();
    }
  </script>
</body>
</html>
